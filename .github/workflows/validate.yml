# Re-verifies every submitted name on the server, and never trusts the client that sent it.
#
# The sender already checked these names, on their own machine with their own build. That check
# is not evidence: a wrong name entered into the community tables is copied outward by everyone
# downstream and is very hard to take back. So the whole claim is re-derived here, against the
# snapshots committed in this repository, before a maintainer looks at anything.
#
# Nothing here needs the game. That is the same property that lets a contributor grind without
# one, and it is why this can run on a plain Linux runner in under a minute.

name: validate

on:
  pull_request:
  push:
    branches: [main]

# A submission that has been superseded by a newer push is not worth finishing.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default build is the one that matters: no features, no dependencies, no game. If this
      # stops compiling on Linux then the project's central claim has quietly stopped being true.
      #
      # Warnings are caught in the same step as the build rather than a later one, because cargo
      # only prints them while it is actually compiling -- a second `cargo build` reads the cache,
      # says nothing, and would pass no matter what the first one printed.
      - name: build with no features, and no warnings
        run: |
          set -o pipefail
          cargo build --release --verbose 2>&1 | tee build.log
          ! grep -q '^warning' build.log

      - name: test
        run: cargo test --release --verbose

      - name: test database spellings, mode merging and seven-game reporting
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # The markdown here is executable instructions for another program: an assistant reads
      # AGENTS.md and does what it says. A binary that has been renamed or a script that has
      # moved is a bug that wastes somebody's night, and nothing else in this pipeline would
      # catch it -- so it is checked like any other bug.
      - name: the documentation describes the repository that exists
        run: python3 scripts/check_docs.py

      # Every reconnaissance script must at least run. They are what an assistant reads before
      # choosing a method, so one that has quietly broken sends the whole night the wrong way.
      #
      # Only the ones that need nothing but the repository. `coverage.py`, `continuations.py`,
      # `cross_type.py` and `families.py` all read the hash tables, which is a few hundred
      # megabytes to fetch -- too much to pay on every push for a smoke test.
      - name: the reconnaissance scripts still run
        run: |
          cd scripts
          python3 -c "import snapshot; shots = [snapshot.read(p) for p in snapshot.snapshots()]; assert len(shots) == 7; assert all(snapshot.IMPORTANT <= set(s.by_pool()) for s in shots); print([(s.game, len(s)) for s in shots])"
          python3 methods_report.py --by-method
          python3 methods_report.py --duplicates

  submissions:
    name: re-verify submitted names
    runs-on: ubuntu-latest
    steps:
      # The full history, because which files a pull request added is a question about two commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: which files this changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # Not `--depth=1`, and not `|| true`: see the `binaries` job below for what both
            # cost. A truncated base ref can leave `A...HEAD` with no merge base, and a diff that
            # then failed would set `any=false` here -- reporting "no submission files changed"
            # and skipping the re-verification this workflow exists for, on a green check.
            git fetch --no-tags origin "${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"

            # A new branch, or a force push, names a base this checkout does not hold. Fall back
            # to the empty tree -- "everything here is new" -- rather than to a failed diff, which
            # under the old `|| true` read as "nothing changed" and skipped the verification.
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base=$(git hash-object -t tree /dev/null)
            fi
          fi

          # Added and modified only. A submission being deleted is a maintainer tidying up.
          #
          # No `|| true`. A diff that fails must stop the run, not report an empty list: an empty
          # list is indistinguishable from "no submissions in this change", and that answer skips
          # the re-verification of names this whole workflow exists to perform.
          if ! files=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'submissions/**/*.txt'); then
            echo "could not diff against $base -- refusing to report 'nothing changed' on a failed diff"
            exit 1
          fi

          if [ -z "$files" ]; then
            echo "no submission files changed"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "$files"
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "$files" > changed.txt
          fi

      - name: build the validator
        if: steps.changed.outputs.any == 'true'
        run: cargo build --release --bin validate

      # Wanted but not required. Anything the tables affect is a note rather than a rejection, so
      # a fetch that fails leaves the verification itself intact -- which is why this cannot fail
      # the run. What it adds is the count of names somebody else published mid-grind.
      - name: pull the published tables
        if: steps.changed.outputs.any == 'true'
        continue-on-error: true
        run: cargo run --release --bin fetch-tables

      - name: re-verify
        if: steps.changed.outputs.any == 'true'
        run: xargs -a changed.txt ./target/release/validate

  # A pull request that carries a rebuilt binary cannot be merged cleanly, and the contributor who
  # sent it did not mean to.
  #
  # `bin/linux` and `bin/macos` are committed by this repository's own workflows, and a fork used
  # to run those workflows too: `submit` syncs the fork's `main` before it branches, that sync is
  # a push touching `src/**`, and the fork then built and committed its own copies. They ride into
  # the next submission, git cannot merge a binary, and each one conflicts against whatever this
  # repository built in the meantime -- which has already cost submissions, one taken by hand
  # "without the binary".
  #
  # Two fixes are upstream of this one: the binary workflows refuse to run outside this repository,
  # and `submit` branches from upstream's head rather than the fork's. This is the backstop that
  # says so out loud when a pull request carries one anyway, because the alternative is a
  # maintainer discovering it at merge time.
  binaries:
    name: a pull request carries no CI-built binaries
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: nothing CI builds may change
        run: |
          set -euo pipefail

          # `fetch-depth: 0` above already fetched the whole history. Re-fetching the base at
          # `--depth=1` would write `.git/shallow` and truncate that ref, and `A...HEAD` needs a
          # merge base -- so on a branch whose base has moved (this one "moves constantly": both
          # binary workflows and every merged submission push to it) the walk can end at the
          # shallow boundary having found no common ancestor at all.
          git fetch --no-tags origin "${{ github.base_ref }}"

          # No `|| true`. A guard whose error path is "approve" is worse than no guard, because
          # from then on a maintainer trusts a green check: a diff that failed for any reason --
          # an unresolvable merge base, a bad ref -- would have reported "no binaries" and passed
          # a pull request carrying exactly what this job exists to catch.
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                    -- 'bin/linux/**' 'bin/macos/**')

          if [ -z "$files" ]; then
            echo "no CI-built binaries in this pull request"
            exit 0
          fi

          echo "This pull request changes files CI builds and commits:"
          echo "$files"
          echo
          echo "Those are built and committed by this repository's own workflows, so a submission"
          echo "must not carry them -- a binary cannot be merged, and it will conflict against"
          echo "whatever was built here in the meantime."
          echo
          echo "bin/windows is deliberately not checked: it has no workflow and is committed by"
          echo "hand from a Windows machine, so a source change legitimately carries it."
          echo
          echo "To fix it, drop those paths from the branch:"
          echo
          echo "    git checkout origin/${{ github.base_ref }} -- bin/linux bin/macos"
          echo "    git commit -m 'Drop the rebuilt binaries from this submission'"
          echo
          echo "If your fork built them itself, it was running the binary workflows; they are now"
          echo "guarded to this repository, so it will not happen again once your fork is synced."
          exit 1
